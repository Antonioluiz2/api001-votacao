spring:
  application:
    name: api001-votacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/votacao}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  callback:
    base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
  userinfo:
    enabled: ${USERINFO_ENABLED:false}
    base-url: ${USERINFO_BASE_URL:https://user-info.herokuapp.com}
    timeout-ms: ${USERINFO_TIMEOUT_MS:3000}

logging:
  level:
    root: INFO
    br.com.cooperativa.votacao: DEBUG
